name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly rebuild so the nginx:alpine base picks up security fixes
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}  # e.g. use GitHub Container Registry
  # Alternatively set IMAGE_NAME to your Docker Hub repo, e.g. username/under-construction-page

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to registry
        # If pushing to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Optionally, add a step to verify or output info
      #- name: Image digest
      #  run: echo "Built image ${{ env.IMAGE_NAME }}:${{ github.sha }}"
